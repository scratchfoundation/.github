# Requests a Copilot code review on the pull request whose label triggered the caller.
#
# Copilot bills a review to the user who requests it. The request here is made with COPILOT_REVIEW_TOKEN, a
# fine-grained PAT for an org machine-user account that holds no Copilot license, so the org's policy for members
# without a license bills the review to the organization no matter who authored the PR or applied the label. (A
# request made with GITHUB_TOKEN would be billed to the PR author instead.) The machine user needs org membership, no
# Copilot plan of any kind, and a repo role that can request reviewers; its PAT needs "Pull requests: write" on each
# adopting repo.
#
# Only people with triage access or higher can apply labels, so this can't be triggered by arbitrary contributors.
#
# To adopt in a repo (steps 1-3 need an org admin; ask one which machine user and team hold this role):
#
#   1. Add the repo to the machine user's team with the triage role.
#   2. Signed in as the machine user, edit its fine-grained PAT (Settings > Developer settings > Fine-grained tokens)
#      and add the repo to its repository list. If the org requires PAT approval, approve the change in org settings.
#   3. In org settings > Secrets and variables > Actions, add the repo to COPILOT_REVIEW_TOKEN's selected repositories.
#   4. Create a `copilot-review` label in the repo.
#   5. Add this caller workflow to the repo's default branch (pull_request_target runs the base branch's copy):
#
#   name: Copilot review
#   on:
#     pull_request_target:
#       types: [labeled]
#   jobs:
#     copilot-review:
#       if: github.event.label.name == 'copilot-review'
#       permissions:
#         pull-requests: write
#       uses: scratchfoundation/.github/.github/workflows/copilot-review.yml@<commit SHA> # main
#       secrets:
#         COPILOT_REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
#
#   6. Verify: apply the label to a PR. The label should disappear, the PR timeline should show `review_requested` by
#      the machine user, and a Copilot review should arrive within a few minutes. A 403 from the request step usually
#      means the PAT lacks access to the repo or is awaiting approval.
#
# Pin to a commit SHA rather than `@main`: the caller runs with write credentials, so each repo should review changes
# to this workflow before running them. Renovate keeps the pin current via digest-update PRs. Those PRs only change the
# SHA, so if this workflow gains a secret or input, don't merge Renovate's PR on its own: update the pin and pass the
# new value in the same caller change (a caller can't pass a secret its pinned version doesn't declare).
#
# This workflow never checks out or runs pull request code, which is what makes pull_request_target (and exposing the
# PAT on fork PRs) safe here.

name: Copilot review

on:
  workflow_call:
    secrets:
      COPILOT_REVIEW_TOKEN:
        required: true

permissions:
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL: ${{ github.event.label.name }}
    steps:
      # Removing the label first lets it be re-applied for another review. If the label is applied twice in quick
      # succession, the second run's removal fails and it stops before requesting a duplicate review.
      - name: Remove trigger label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$LABEL"
      # Copilot picks up the request immediately, so it never appears in the PR's pending reviewers. A
      # copilot_work_started timeline event and, later, a review are the signs that it worked.
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
        run: gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
