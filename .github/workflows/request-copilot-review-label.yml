# Caller for this repo's own PRs. Other repos pin the reusable workflow to a commit SHA, but here it's referenced by
# local path: a SHA pin to this repo would get a Renovate bump after every merge, and each bump is itself a merge.
# pull_request_target resolves the local path from the base branch, so this still only runs reviewed code.

name: Request Copilot review
on:
  pull_request_target:
    types: [labeled]

jobs:
  request-copilot-review:
    if: github.event.label.name == 'request-copilot-review'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/request-copilot-review.yml
    secrets:
      COPILOT_REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
